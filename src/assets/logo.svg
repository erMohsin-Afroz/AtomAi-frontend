<svg width="98" height="96" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Nucleus (Center) -->
  <circle cx="50" cy="50" r="9" fill="#fff" />
  
  <!-- Electron Orbits -->
  <ellipse cx="50" cy="50" rx="42" ry="14" fill="none" stroke="#fff" stroke-width="3" transform="rotate(0 50 50)" />
  <ellipse cx="50" cy="50" rx="42" ry="14" fill="none" stroke="#fff" stroke-width="3" transform="rotate(60 50 50)" />
  <ellipse cx="50" cy="50" rx="42" ry="14" fill="none" stroke="#fff" stroke-width="3" transform="rotate(120 50 50)" />
  
  <!-- Electrons -->
  <circle cx="92" cy="50" r="4" fill="#fff" />
  <circle cx="29" cy="14" r="4" fill="#fff" />
  <circle cx="29" cy="86" r="4" fill="#fff" />
</svg>
